<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Círculo Blanco con Sombra (Acento) -->
  <circle cx="50" cy="50" r="40" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Letra 'o' dentro del círculo -->
  <text x="25" y="72" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="#000000">o</text>

  <!-- Texto 'AI' -->
  <text x="70" y="44" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14" fill="#000000">A</text>
  <text x="72" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14" fill="#000000">I</text>
</svg>
