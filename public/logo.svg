<svg width="300" height="100" viewBox="0 0 300 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Texto Principal: Synkr -->
  <text x="20" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="#000000" letter-spacing="-2">Synkr</text>

  <!-- Círculo Blanco con Sombra (Acento) -->
  <circle cx="218" cy="48" r="36" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Letra 'o' dentro del círculo -->
  <text x="194" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="#000000">o</text>

  <!-- Texto 'AI' -->
  <text x="238" y="44" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14" fill="#000000">A</text>
  <text x="240" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14" fill="#000000">I</text>
</svg>
